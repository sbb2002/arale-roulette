<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가라가라 추첨기</title>
<style>
  :root {
    --wood-light: #d9a86c;
    --wood-mid: #b5793f;
    --wood-dark: #7a4e26;
    --wood-darker: #5a3719;
    --frame: #4a2e15;
    --metal: #3a3a3a;
    --paper: #f6ecd9;

    /* machine body: soft lavender-tinted white that sits well on the pink/blue background */
    --body-white: #fbfaff;
    --body-soft: #ece9f7;
    --body-edge: #cdc8e3;
    --body-shade: #a29cc4;

    --red: #d94f3d;
    --blue: #6ec6ff;
    --lime: #cfe04a;
    --purple: #b06cf0;
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  html { background: #fff8eb; }
  /* side margins: smooth, saturated diagonal rainbow, fading to blue toward the bottom */
  html::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -2;
    background: linear-gradient(105deg,
      #ff1a1a 0%, #e61fb4 10%, #a21fe6 20%, #2a4bff 32%, #00c8ff 42%,
      #00f0b0 50%, #3dff2a 60%, #d8ff00 72%, #ffb000 84%, #ff2a1a 100%);
    pointer-events: none;
  }
  html::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background: linear-gradient(180deg, rgba(255, 119, 136, 0) 0%, rgba(255, 119, 136, .12) 35%, rgba(34, 136, 221, .35) 100%);
    pointer-events: none;
  }
  /* floating decorations (pattern ported from mewtype-scheduler): pink -> blue vertical gradient shapes */
  #bgdeco { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  #bgdeco svg { display: block; width: 100%; height: 100%; }
  #bgdeco .bgd-pink { stop-color: #ff7788; }
  #bgdeco .bgd-blue { stop-color: #2288dd; }
  #bgdeco .bgd-shape { opacity: .75; }
  /* corner mascot popping out from the bottom-right */
  .popper {
    position: fixed;
    right: -4vmin;
    bottom: -6vmin;
    width: clamp(160px, 26vmin, 300px);
    z-index: 1;
    pointer-events: none;
    transform-origin: 100% 100%;
    transform: rotate(-8deg);
    animation: pop-out .7s cubic-bezier(.2, 1.4, .4, 1) .3s backwards;
  }
  @keyframes pop-out {
    from { transform: translate(60%, 60%) rotate(18deg) scale(.6); }
  }
  @media (prefers-reduced-motion: reduce) { .popper { animation: none; } }
  body {
    margin: 0;
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    font-family: "Pretendard", "Malgun Gothic", sans-serif;
    background:
      linear-gradient(rgba(255, 248, 235, .38), rgba(255, 248, 235, .38)) center top / auto 100% no-repeat fixed,
      url("background.jpg") center top / auto 100% no-repeat fixed;
    padding: 32px 16px;
  }
  /* shake: the body (and its fixed background) stays still; each top-level piece
     jitters on its own, with a random amplitude, speed and direction set in JS */
  body.shake > :not(script):not(.popper):not(.win-overlay):not(#bgdeco) {
    animation: jitter var(--sd, .28s) ease-in-out infinite alternate var(--sdir, normal);
  }
  @keyframes jitter {
    0%   { transform: translate(calc(var(--sx, 4px) * -1), calc(var(--sy, 3px) * -1)) rotate(calc(var(--sr, 0deg) * -1)); }
    100% { transform: translate(var(--sx, 4px), var(--sy, 3px)) rotate(var(--sr, 0deg)); }
  }
  h1 {
    margin: 0;
    font-size: clamp(18px, 5vw, 26px);
    color: var(--frame);
    text-align: center;
    padding: 8px 70px;
    border-radius: 999px;
    background: rgba(255, 248, 235, .88);
  }

  /* ---------- machine ---------- */
  .machine {
    position: relative;
    width: min(420px, 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .cage {
    position: relative;
    width: 100%;
    aspect-ratio: 420 / 380;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }

  /* octagonal drum - large, nearly touching the stand below */
  .octagon-wrap {
    position: relative;
    width: 85.71%;
    aspect-ratio: 1;
    /* clip-path would cut off a box-shadow, so the drum's shadow is cast from the wrapper */
    filter: drop-shadow(0 8px 10px rgba(60, 40, 120, .35));
  }
  /* the octagon itself is the outline colour; the ::before inset 8px is the white face */
  .octagon {
    position: absolute;
    inset: 0;
    clip-path: polygon(
      30% 0%, 70% 0%, 100% 30%, 100% 70%,
      70% 100%, 30% 100%, 0% 70%, 0% 30%
    );
    background: var(--body-shade);
    cursor: pointer;
  }
  .octagon::before {
    content: "";
    position: absolute;
    inset: 8px;
    clip-path: polygon(
      30% 0%, 70% 0%, 100% 30%, 100% 70%,
      70% 100%, 30% 100%, 0% 70%, 0% 30%
    );
    background: radial-gradient(circle at 35% 28%, var(--body-white), var(--body-soft) 80%);
    box-shadow: inset 0 0 30px rgba(90, 70, 150, .22);
  }
  /* octagon shatters into 8 pie-slice fragments when all chances run out */
  .octagon, .hub, .crank-orbit {
    transition: opacity .35s ease;
  }
  .shatter-frag {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 35% 28%, var(--body-white), var(--body-soft) 80%);
    box-shadow: inset 0 0 20px rgba(90, 70, 150, .25);
    transition: transform 1s cubic-bezier(.2,.8,.3,1), opacity 1s ease;
    z-index: 5;
  }

  /* time-space storm effect: fades in when the drum is near max speed,
     spins together with it, and fades back out as it slows down */
  .storm {
    position: absolute;
    inset: 0;
    clip-path: polygon(
      30% 0%, 70% 0%, 100% 30%, 100% 70%,
      70% 100%, 30% 100%, 0% 70%, 0% 30%
    );
    opacity: 0;
    transition: opacity .5s ease;
    pointer-events: none;
    z-index: 1;
  }
  /* normal blending: "screen" vanishes on the white drum face */
  .storm.show { opacity: .42; }
  .storm img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* blue flame rim: individual flickering tongues sprouting from the drum's
     edge while the speed cap is doubled, plus a soft haze behind them */
  .flame {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity .3s ease;
    z-index: 2;
  }
  .flame.show { opacity: 1; }
  .flame::before {
    content: "";
    position: absolute;
    inset: -8%;
    clip-path: polygon(
      30% 0%, 70% 0%, 100% 30%, 100% 70%,
      70% 100%, 30% 100%, 0% 70%, 0% 30%
    );
    background: radial-gradient(circle, rgba(130,200,255,.32), rgba(40,120,255,.14) 55%, transparent 74%);
    filter: blur(14px);
    mix-blend-mode: screen;
    animation: flameHaze 1.1s ease-in-out infinite alternate;
  }
  @keyframes flameHaze {
    0%   { opacity: .65; }
    100% { opacity: 1; }
  }
  .flame-spike {
    position: absolute;
    width: 0;
    height: 0;
    transform: translate(-50%, -50%) rotate(var(--angle));
  }
  .flame-spike-inner {
    position: absolute;
    left: 50%;
    bottom: 0;
    width: clamp(16px, 4.6vw, 26px);
    height: clamp(34px, 10vw, 54px);
    margin-left: clamp(-13px, -2.3vw, -8px);
    transform-origin: 50% 100%;
    animation-name: flameFlicker;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    animation-direction: alternate;
  }
  /* outer flame body: deep blue base fading up through cyan */
  .flame-spike-inner::before,
  .flame-spike-inner::after {
    content: "";
    position: absolute;
    inset: 0;
    clip-path: polygon(
      50% 100%, 24% 78%, 34% 52%, 14% 30%,
      40% 10%, 50% 30%, 66% 6%, 62% 34%,
      86% 26%, 68% 56%, 82% 78%, 50% 100%
    );
    mix-blend-mode: screen;
  }
  .flame-spike-inner::before {
    background: linear-gradient(
      0deg,
      rgba(10,70,190,0) 0%,
      rgba(20,95,225,.9) 22%,
      rgba(45,140,255,.95) 55%,
      rgba(140,215,255,.95) 85%,
      rgba(225,248,255,.9) 100%
    );
    filter: blur(.6px);
  }
  /* inner hot core: brighter, smaller, sits toward the tip */
  .flame-spike-inner::after {
    inset: 30% 26% 4% 26%;
    clip-path: polygon(
      50% 100%, 26% 70%, 38% 44%, 50% 6%,
      64% 40%, 78% 68%, 50% 100%
    );
    background: linear-gradient(
      0deg,
      rgba(120,200,255,0) 0%,
      rgba(170,225,255,.85) 40%,
      rgba(255,255,255,.95) 100%
    );
    filter: blur(.3px);
  }
  @keyframes flameFlicker {
    0%   { transform: scale(var(--fscale, 1)) scaleY(.82) scaleX(.85) skewX(-5deg) rotate(-2deg); opacity: .78; }
    35%  { transform: scale(var(--fscale, 1)) scaleY(1.12) scaleX(1.02) skewX(2deg) rotate(1deg); opacity: 1; }
    70%  { transform: scale(var(--fscale, 1)) scaleY(.95) scaleX(.92) skewX(-3deg) rotate(-1deg); opacity: .88; }
    100% { transform: scale(var(--fscale, 1)) scaleY(1.2) scaleX(1.08) skewX(4deg) rotate(2deg); opacity: 1; }
  }
  .hub {
    position: absolute;
    left: 50%; top: 50%;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #666, var(--metal) 70%);
    transform: translate(-50%,-50%);
    box-shadow: 0 0 6px rgba(0,0,0,.5);
    z-index: 2;
  }

  /* handle mounted on the drum's rim: this layer rotates together with
     the drum (revolves around the center); the handle graphic inside it
     counter-rotates so it never spins in place, only travels in a circle */
  .crank-orbit {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .crank {
    position: absolute;
    left: 50%;
    top: 0px;
    width: 34px;
    height: 34px;
    margin-left: -17px;
    margin-top: -17px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--body-white), var(--body-edge) 75%);
    border: 3px solid var(--body-shade);
    box-shadow: 0 3px 6px rgba(60, 40, 120, .3), inset 0 0 6px rgba(90, 70, 150, .2);
    cursor: pointer;
    pointer-events: auto;
  }
  .crank::after {
    /* top-view center bolt */
    content: "";
    position: absolute;
    left: 50%; top: 50%;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--metal);
    transform: translate(-50%,-50%);
  }
  .crank.disabled { cursor: not-allowed; filter: grayscale(.4) brightness(.9); }

  /* stand / frame */
  .stand {
    width: 71.43%;
    aspect-ratio: 300 / 70;
    position: relative;
    margin-top: -8px;
  }
  .stand::before, .stand::after {
    content: "";
    position: absolute;
    top: 0;
    width: 16px;
    height: 100%;
    background: linear-gradient(180deg, var(--body-white), var(--body-edge));
    z-index: 0; /* both legs stay behind the base plate */
    border: 2px solid var(--body-shade);
    border-radius: 3px;
    box-shadow: 3px 4px 6px rgba(60, 40, 120, .3);
  }
  .stand::before { left: 40px; transform: rotate(8deg); transform-origin: top; }
  .stand::after { right: 40px; transform: rotate(-8deg); transform-origin: top; }
  .base {
    z-index: 1;
    position: absolute;
    bottom: 0;
    left: 10px;
    right: 10px;
    height: 16px;
    background: linear-gradient(180deg, var(--body-soft), var(--body-edge));
    border: 2px solid var(--body-shade);
    border-radius: 6px;
    box-shadow: 0 7px 10px rgba(60, 40, 120, .4);
  }

  /* chute + tray */
  .chute {
    position: absolute;
    left: 50%;
    bottom: 6px;
    transform: translateX(-50%);
    width: 26px;
    height: 30px;
    background: linear-gradient(180deg, var(--body-shade), #6f6894);
    clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%);
    z-index: 3;
  }
  .tray {
    width: 28.57%;
    height: 26px;
    background: linear-gradient(180deg, var(--body-soft), var(--body-edge));
    border: 2px solid var(--body-shade);
    border-top: none;
    border-radius: 0 0 10px 10px;
    margin-top: -2px;
    box-shadow: inset 0 4px 6px rgba(60, 40, 120, .3), 0 6px 9px rgba(60, 40, 120, .35);
  }

  /* ball that physically bounces around the page after it drops */
  .phys-ball {
    position: fixed;
    left: 0;
    top: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    box-shadow: inset -4px -4px 8px rgba(0,0,0,.25), inset 4px 4px 8px rgba(255,255,255,.5), 0 4px 8px rgba(0,0,0,.3);
    z-index: 50;
    pointer-events: none;
    opacity: 1;
    transition: opacity .6s ease;
  }

  /* ---------- result panel ---------- */
  .result-window {
    width: min(260px, 100%);
    min-height: 100px;
    background: #fff;
    border: 3px solid var(--wood-darker);
    border-radius: 12px;
    box-shadow: 0 6px 14px rgba(0,0,0,.2);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px;
  }
  .ball {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    box-shadow: inset -6px -6px 10px rgba(0,0,0,.2), inset 6px 6px 10px rgba(255,255,255,.5);
    opacity: 0;
    transform: scale(.3);
    transition: all .3s cubic-bezier(.3,1.4,.4,1);
  }
  .ball.show { opacity: 1; transform: scale(1); }
  .ball.white { background: var(--paper); border: 2px solid #cbb98f; }
  .ball.red { background: var(--red); }
  .ball.blue { background: var(--blue); }
  .ball.lime { background: var(--lime); }
  .ball.purple { background: var(--purple); }

  .msg { font-size: 19px; font-weight: 700; min-height: 24px; color: #5a3d1e; }
  .msg.win { color: #c22a6a; }
  .msg.lose { color: #8a7862; }

  /* chances */
  .chances {
    display: flex;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .92);
  }
  .chance-dot {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--wood-mid);
    border: 2px solid var(--wood-darker);
  }
  .chance-dot.used {
    background: transparent;
    opacity: .35;
  }
  .chance-dot.red { background: var(--red); border-color: var(--wood-darker); opacity: 1; }
  .chance-dot.blue { background: var(--blue); border-color: var(--wood-darker); opacity: 1; }
  .chance-dot.lime { background: var(--lime); border-color: var(--wood-darker); opacity: 1; }
  .chance-dot.purple { background: var(--purple); border-color: var(--wood-darker); opacity: 1; }
  .chance-dot.white { background: var(--paper); border-color: #cbb98f; opacity: 1; }

  .legend {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    font-size: 12px;
    color: var(--frame);
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .92);
  }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .dot.red { background: var(--red); }
  .dot.blue { background: var(--blue); }
  .dot.lime { background: var(--lime); }
  .dot.purple { background: var(--purple); }
  .dot.white { background: var(--paper); border: 1px solid #cbb98f; }

  .hint {
    font-size: 13px;
    color: #6b5535;
    text-align: center;
    padding: 6px 16px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .92);
  }

  button.reset {
    position: relative;
    z-index: 9; /* stays above the game-over dimming overlay */
    padding: 8px 18px;
    font-size: 13px;
    font-weight: 700;
    border: 2px solid var(--wood-darker);
    border-radius: 999px;
    background: var(--wood-mid);
    color: #fff;
    cursor: pointer;
  }

  /* ---------- game over dimming overlay (all chances used, no win) ---------- */
  .gameover-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .72);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .8s ease;
    z-index: 8;
  }
  .gameover-overlay.show {
    opacity: 1;
  }
  .gameover-text {
    font-size: clamp(18px, 6vw, 26px);
    font-weight: 800;
    color: #f0e3c8;
    letter-spacing: .05em;
    text-shadow: 0 2px 10px rgba(0,0,0,.6);
    text-align: center;
    padding: 0 16px;
  }

  /* ---------- win celebration overlay ---------- */
  .win-overlay {
    position: fixed;
    inset: 0;
    background: rgba(40, 24, 8, .55);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .9s ease;
    z-index: 10;
  }
  .win-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  .win-card {
    background: #fff;
    border-radius: 20px;
    padding: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    box-shadow: 0 20px 50px rgba(0,0,0,.4);
    transform: scale(.9);
    transition: transform .9s cubic-bezier(.3,1.3,.4,1);
    max-width: 92vw;
    max-height: 92vh;
  }
  .win-overlay.show .win-card { transform: scale(1); }
  .win-card img {
    max-width: min(640px, 85vw);
    max-height: 65vh;
    width: 100%;
    border-radius: 12px;
    object-fit: contain;
  }
  .win-text {
    font-size: 28px;
    font-weight: 800;
    color: #c22a6a;
  }
  .win-bigspender {
    display: none;
    font-size: 16px;
    font-weight: 800;
    color: #b5793f;
  }
  .win-bigspender.show { display: block; }
  .win-effort {
    font-size: 13px;
    color: #8a7862;
  }
  .effort-badge {
    position: fixed;
    top: 10px;
    right: 8px;
    max-width: 42vw;
    padding: 5px 10px;
    border-radius: 999px;
    background: var(--paper);
    border: 2px solid var(--wood-darker);
    color: var(--frame);
    font-size: clamp(9px, 2.6vw, 12px);
    font-weight: 700;
    box-shadow: 0 3px 8px rgba(0,0,0,.15);
    z-index: 20;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .win-close {
    padding: 8px 20px;
    border: none;
    border-radius: 999px;
    background: var(--wood-mid);
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  }
  .win-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  .win-invite {
    padding: 8px 20px;
    border-radius: 999px;
    background: linear-gradient(135deg, #ff7788, #2288dd);
    color: #fff;
    font-weight: 700;
    text-decoration: none;
  }
</style>
</head>
<body>

<div id="bgdeco" aria-hidden="true"></div>

<h1>일윅에서 어레일과 유노상쟝를❗ 만나자~</h1>

<div class="effort-badge" id="effortBadge">현재까지 쏟아부은 노오오오력 : 0원</div>

<div class="machine">
  <div class="cage">
    <div class="octagon-wrap" id="octagonWrap">
      <div class="octagon" id="octagon"></div>
      <div class="storm" id="storm">
        <img src="timespace_storm.jpg" alt="">
      </div>
      <div class="flame" id="flame"></div>
      <div class="hub"></div>
      <div class="crank-orbit" id="crankOrbit">
        <div class="crank" id="crank"></div>
      </div>
    </div>
    <div class="chute" id="chute"></div>
  </div>
  <div class="stand">
    <div class="base"></div>
  </div>
  <div class="tray"></div>
</div>

<div class="hint" id="spinHint">손잡이를 여러 번 클릭해서 돌려보세요 (계속 클릭하면 더 빨리 돌아가요)</div>

<div class="result-window">
  <div class="ball" id="ball"></div>
  <div class="msg" id="msg">기회 5번, 도전해보세요!</div>
</div>

<div class="chances" id="chances"></div>

<div class="legend">
  <span><i class="dot red"></i>빨강</span>
  <span><i class="dot blue"></i>하늘</span>
  <span><i class="dot lime"></i>연두</span>
  <span><i class="dot purple"></i>보라</span>
  <span><i class="dot white"></i>꽝</span>
</div>

<button class="reset" id="resetBtn">새 게임 시작 (기회 5회 초기화)</button>

<div class="win-overlay" id="winOverlay">
  <div class="win-card">
    <img src="ooaddari.png" alt="당첨 축하" id="winImage">
    <div class="win-text">당첨을 축하합니다! 🎉</div>
    <div class="win-bigspender" id="winBigSpender">부시로의 대주주시네요!!👍</div>
    <div class="win-effort" id="winEffort">현재까지 쏟아부은 노오오오력 : 0원</div>
    <div class="win-actions">

function spawnPhysicsBall(color, flood = false) {

    x: originX,

    vx: Math.cos(launchAngle) * launchSpeed,
    vy: Math.sin(launchAngle) * launchSpeed,
    spawnTime: performance.now(),
    keep: flood, // flood balls stay until the surge ends

    floorY: flood ? window.innerHeight - BALL_SIZE - Math.random() * (window.innerHeight * FLOOD_SCREEN_FRACTION - BALL_SIZE) : null,

function updatePhysicsBalls(dt) {
  const baseFloorY = window.innerHeight - BALL_SIZE;
  const rightX = window.innerWidth - BALL_SIZE;

  for (let i = physicsBalls.length - 1; i >= 0; i--) {
    const b = physicsBalls[i];
    const floorY = b.floorY ?? baseFloorY;
    b.vy += GRAVITY * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;

    if (b.y >= floorY) {
      b.y = floorY;
      b.vy = -b.vy * RESTITUTION;
      b.vx *= FLOOR_FRICTION;
      if (Math.abs(b.vy) < 70) b.vy = 0;
    }
    if (b.x <= 0) { b.x = 0; b.vx = -b.vx * RESTITUTION; }
    if (b.x >= rightX) { b.x = rightX; b.vx = -b.vx * RESTITUTION; }
    if (b.y <= 0) { b.y = 0; b.vy = -b.vy * RESTITUTION; }

    b.el.style.transform = `translate(${b.x}px, ${b.y}px)`;

    const age = (performance.now() - b.spawnTime) / 1000;
    const settled = b.vy === 0 && Math.abs(b.vx) < 8;

}

// ---------- floating background decorations ----------
// Ported from mewtype-scheduler (bgdeco.js / bglogic.js): every shape moves in its own random
// direction at its own speed, bounces off the walls, collides elastically with the others and
// picks up spin from glancing hits. Here the whole field's speed follows the drum: slow at rest,
// easing up once the drum is accelerating, and holding top speed while the drum does.
const BGD_NS = 'http://www.w3.org/2000/svg';
const BGD_KINDS = ['ring', 'tri', 'wave', 'dot', 'gem'];
const BGD_SPOTS = [[.08,.07],[.92,.10],[.05,.33],[.95,.40],[.09,.60],[.91,.66],[.50,.95],[.20,.90],[.80,.92],[.05,.82],[.96,.83]];
const BGD_REST_SPEED = 0.025; // shapes' cruising speed at rest, in short-side lengths per second
const BGD_SPEED_START = 0.3;  // drum speed ratio where the speed-up begins
const BGD_SPEED_MAX = 24;     // speed multiplier at top drum speed
const BGD_SPEED_EASE = 1.6;   // 1/sec, how quickly the field's speed follows its target
const BGD_VEL_EASE = 3;       // 1/sec, how quickly each shape's velocity follows the field speed
const bgdEl = document.getElementById('bgdeco');
const bgdReduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let bgdItems = [];
let bgdBodies = [];
let bgdSpeed = 1;

function bgdSv(tag, attrs, parent) {
  const n = document.createElementNS(BGD_NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

function bgdStops(grad) {
  bgdSv('stop', { offset: '0', class: 'bgd-pink' }, grad);
  bgdSv('stop', { offset: '0.6', class: 'bgd-pink' }, grad);
  bgdSv('stop', { offset: '1', class: 'bgd-blue' }, grad);
}

function bgdShape(it, gradId, parent) {
  const { x, y, u, kind, ang } = it;
  const common = { transform: `rotate(${ang} ${x} ${y})`, class: 'bgd-shape' };
  const line = { ...common, fill: 'none', stroke: `url(#${gradId})`, 'stroke-width': Math.max(3.5, u * 0.2), 'stroke-linecap': 'round', 'stroke-linejoin': 'round' };
  if (kind === 'ring') return bgdSv('circle', { ...line, cx: x, cy: y, r: u }, parent);
  if (kind === 'tri') return bgdSv('polygon', { ...line, points: `${x},${y - u} ${x + u},${y + u * .8} ${x - u},${y + u * .8}` }, parent);
  if (kind === 'wave') return bgdSv('path', { ...line, d: `M${x - u * 1.8} ${y} q${u * .9} ${-u * 1.1} ${u * 1.8} 0 t${u * 1.8} 0` }, parent);
  if (kind === 'dot') return bgdSv('circle', { ...common, cx: x, cy: y, r: u * .45, fill: `url(#${gradId})` }, parent);
  return bgdSv('rect', { ...common, x: x - u * .75, y: y - u * .75, width: u * 1.5, height: u * 1.5, rx: 3, fill: `url(#${gradId})` }, parent);
}

function bgdMakeBody(it, W, H) {
  const sc = Math.min(W, H);
  return { cx: it.x, cy: it.y, r: it.u * 1.25, W, H, m: sc * 0.04, sc, ox: 0, oy: 0, vx: 0, vy: 0, th: 0, w: 0, base: 1 };
}

// one physics step: walls (80% bounce, spin on impact), then circle-approximated elastic collisions
function bgdStep(bodies, dt) {
  const clampW = (w) => Math.max(-10, Math.min(10, w));
  for (const b of bodies) {
    b.w *= Math.exp(-0.7 * dt); // spin lingers longer than movement
    b.ox += b.vx * dt; b.oy += b.vy * dt; b.th += b.w * dt;
    const spin = (v) => { b.w += (Math.random() < .5 ? -1 : 1) * Math.min(10, v / b.sc * 4); };
    const x = b.cx + b.ox, y = b.cy + b.oy;
    if (x < b.m) { b.ox = b.m - b.cx; spin(Math.abs(b.vx)); b.vx = Math.abs(b.vx) * 0.8; }
    else if (x > b.W - b.m) { b.ox = b.W - b.m - b.cx; spin(Math.abs(b.vx)); b.vx = -Math.abs(b.vx) * 0.8; }
    if (y < b.m) { b.oy = b.m - b.cy; spin(Math.abs(b.vy)); b.vy = Math.abs(b.vy) * 0.8; }
    else if (y > b.H - b.m) { b.oy = b.H - b.m - b.cy; spin(Math.abs(b.vy)); b.vy = -Math.abs(b.vy) * 0.8; }
  }
  for (let i = 0; i < bodies.length; i++) for (let j = i + 1; j < bodies.length; j++) {
    const p = bodies[i], q = bodies[j];
    const dx = q.cx + q.ox - p.cx - p.ox, dy = q.cy + q.oy - p.cy - p.oy, d = Math.hypot(dx, dy), min = p.r + q.r;
    if (d >= min || d < 0.01) continue;
    const nx = dx / d, ny = dy / d, push = (min - d) / 2;
    p.ox -= nx * push; p.oy -= ny * push; q.ox += nx * push; q.oy += ny * push;
    const rvx = q.vx - p.vx, rvy = q.vy - p.vy, vn = rvx * nx + rvy * ny;
    if (vn < 0) { // only while approaching
      const jn = -(1 + 0.85) * vn / 2;
      p.vx -= jn * nx; p.vy -= jn * ny; q.vx += jn * nx; q.vy += jn * ny;
      const vt = rvx * -ny + rvy * nx; // tangential speed: glancing hits add spin
      p.w = clampW(p.w + vt / p.r * 0.5); q.w = clampW(q.w + vt / q.r * 0.5);
    }
  }
}

function buildBgDeco() {
  const W = window.innerWidth, H = window.innerHeight;
  const u = Math.min(W, H) * 0.04;
  // seeded PRNG so the layout is the same on every load
  let seed = 21;
  const rand = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

  bgdEl.innerHTML = '';
  const svg = bgdSv('svg', { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'none' }, bgdEl);
  const defs = bgdSv('defs', {}, svg);
  bgdItems = [];
  bgdBodies = [];

  BGD_SPOTS.forEach(([fx, fy], i) => {
    const it = { x: fx * W, y: fy * H, u, kind: BGD_KINDS[i % 5], ang: Math.round(rand() * 360) };
    const gradId = `bgd-g${i}`;
    const grad = bgdSv('linearGradient', { id: gradId, gradientUnits: 'userSpaceOnUse', x1: it.x, y1: it.y - u * 1.9, x2: it.x, y2: it.y + u * 1.9, gradientTransform: `rotate(${-it.ang} ${it.x} ${it.y})` }, defs);
    bgdStops(grad);
    const g = bgdSv('g', {}, svg);
    bgdShape(it, gradId, g);

    // each shape cruises in its own random direction at its own speed
    const body = bgdMakeBody(it, W, H);
    const dir = rand() * Math.PI * 2;
    body.base = (0.5 + rand()) * BGD_REST_SPEED * body.sc;
    body.vx = Math.cos(dir) * body.base;
    body.vy = Math.sin(dir) * body.base;
    bgdItems.push({ g, grad, it });
    bgdBodies.push(body);
  });

  // long zigzag scribble along the bottom
  const gradId = 'bgd-line';
  const grad = bgdSv('linearGradient', { id: gradId, gradientUnits: 'userSpaceOnUse', x1: 0, y1: 0, x2: 0, y2: H }, defs);
  bgdStops(grad);
  const x0 = W * .06, y0 = H * .97, x1 = W * .94, y1 = H * .92, N = 25;
  let d = '';
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1);
    const off = (i % 2 ? 1 : -1) * H * .012 * (.35 + .65 * rand());
    d += `${i ? 'L' : 'M'}${(x0 + (x1 - x0) * t).toFixed(1)} ${(y0 + (y1 - y0) * t + off).toFixed(1)} `;
  }
  bgdSv('path', { d, fill: 'none', stroke: `url(#${gradId})`, 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', class: 'bgd-shape' }, svg);
}

function updateBgDeco(dt, vel) {
  if (bgdReduce) return;
  const ratio = Math.min(vel / MAX_VELOCITY, 1);
  const k = Math.min(Math.max((ratio - BGD_SPEED_START) / (1 - BGD_SPEED_START), 0), 1);
  const target = 1 + (BGD_SPEED_MAX - 1) * k * k * (3 - 2 * k); // smoothstep
  bgdSpeed += (target - bgdSpeed) * Math.min(1, BGD_SPEED_EASE * dt);

  // ease every shape's speed toward base * field speed, keeping its current direction
  for (const b of bgdBodies) {
    const mag = Math.hypot(b.vx, b.vy);
    if (mag > 0.01) {
      const want = mag + (b.base * bgdSpeed - mag) * Math.min(1, BGD_VEL_EASE * dt);
      b.vx *= want / mag; b.vy *= want / mag;
    }
  }
  // sub-step so fast shapes can't tunnel through each other or the walls
  const steps = Math.max(1, Math.ceil(bgdSpeed / 6));
  for (let i = 0; i < steps; i++) bgdStep(bgdBodies, dt / steps);

  bgdBodies.forEach((b, i) => {
    const { g, grad, it } = bgdItems[i];
    const deg = b.th * 180 / Math.PI;
    g.setAttribute('transform', `translate(${b.ox.toFixed(1)} ${b.oy.toFixed(1)}) rotate(${deg.toFixed(1)} ${it.x} ${it.y})`);
    grad.setAttribute('gradientTransform', `rotate(${(-it.ang - deg).toFixed(1)} ${it.x} ${it.y})`); // keep pink on top, blue below
  });
}

buildBgDeco();
let bgdResizeT = 0;
window.addEventListener('resize', () => { clearTimeout(bgdResizeT); bgdResizeT = setTimeout(buildBgDeco, 200); });

// ---------- shake: random amplitude / speed / direction per top-level element ----------
function randomizeShake() {
  const rnd = (min, max) => min + Math.random() * (max - min);
  const sign = () => (Math.random() < .5 ? -1 : 1);
  for (const el of document.body.children) {
    el.style.setProperty('--sx', (sign() * rnd(1.5, 6)).toFixed(1) + 'px');
    el.style.setProperty('--sy', (sign() * rnd(1.5, 6)).toFixed(1) + 'px');
    el.style.setProperty('--sr', (sign() * rnd(0, .6)).toFixed(2) + 'deg');
    el.style.setProperty('--sd', rnd(.08, .35).toFixed(2) + 's');
    el.style.setProperty('--sdir', Math.random() < .5 ? 'normal' : 'alternate-reverse');
  }
}

// ---------- spinning drum loop sound (fades out fast once it stops) ----------
const spinSound = new Audio('garagra_sound.mp3');
spinSound.loop = true;
spinSound.preload = 'auto';
spinSound.volume = 0;
let spinSoundPlaying = false;
let spinVolume = 0;
const SPIN_VOLUME_TARGET = 0.55;
const SPIN_FADE_IN_RATE = 4;   // volume/sec, quick ramp-up when spinning starts
const SPIN_FADE_OUT_RATE = 7;  // volume/sec, fast fade-out once it stops

function updateSpinSound(dt, spinning) {
  const target = spinning ? SPIN_VOLUME_TARGET : 0;
  const rate = spinning ? SPIN_FADE_IN_RATE : SPIN_FADE_OUT_RATE;

  if (spinVolume < target) {
    spinVolume = Math.min(target, spinVolume + rate * dt);
  } else if (spinVolume > target) {
    spinVolume = Math.max(target, spinVolume - rate * dt);
  }
  spinSound.volume = spinVolume;

  if (spinning && !spinSoundPlaying) {
    spinSoundPlaying = true;
    spinSound.play().catch(() => {});
  } else if (!spinning && spinSoundPlaying && spinVolume <= 0.001) {
    spinSoundPlaying = false;
    spinSound.pause();
    spinSound.currentTime = 0;
  }
}

// ---------- time-space storm sound: plays once per storm-icon appearance,
// fades out fast if the storm ends while it's still playing ----------
const stormSound = new Audio('timespace_strom_morn.mp3');
stormSound.preload = 'auto';
let stormSoundPlaying = false;
let stormVolume = 0;
const STORM_VOLUME_TARGET = 0.6;
const STORM_FADE_OUT_RATE = 8; // volume/sec, fast fade-out once the storm ends

function updateStormSound(dt, showing) {
  if (showing) {
    if (!stormSoundPlaying) {
      stormSoundPlaying = true;
      stormVolume = STORM_VOLUME_TARGET;
      stormSound.currentTime = 0;
      stormSound.volume = stormVolume;
      stormSound.play().catch(() => {});
    } else {
      stormVolume = STORM_VOLUME_TARGET;
      stormSound.volume = stormVolume;
    }
  } else if (stormSoundPlaying) {
    stormVolume = Math.max(0, stormVolume - STORM_FADE_OUT_RATE * dt);
    stormSound.volume = stormVolume;
    if (stormVolume <= 0.001) {
      stormSoundPlaying = false;
      stormSound.pause();
      stormSound.currentTime = 0;
    }
  }
}

// ---------- octagon shatter (all chances used up without winning) ----------
// the octagon's own clip-path vertices, as [x%, y%] pairs going around the rim
const OCTAGON_VERTS = [
  [30, 0], [70, 0], [100, 30], [100, 70],
  [70, 100], [30, 100], [0, 70], [0, 30],
];
let shatterFrags = [];

  crankOrbit.style.opacity = '0';
  storm.classList.remove('show');

  for (let i = 0; i < OCTAGON_VERTS.length; i++) {
    const a = OCTAGON_VERTS[i];
    const b = OCTAGON_VERTS[(i + 1) % OCTAGON_VERTS.length];
    const frag = document.createElement('div');
    frag.className = 'shatter-frag';
    frag.style.clipPath = `polygon(50% 50%, ${a[0]}% ${a[1]}%, ${b[0]}% ${b[1]}%)`;
    octagonWrap.appendChild(frag);
    shatterFrags.push(frag);

    // midpoint of this slice's outer edge gives the outward burst direction
    const midX = (a[0] + b[0]) / 2 - 50;
    const midY = (a[1] + b[1]) / 2 - 50;
    const len = Math.hypot(midX, midY) || 1;
    const dist = 180 + Math.random() * 160;
    const dx = (midX / len) * dist;
    const dy = (midY / len) * dist;
    const rot = (Math.random() - 0.5) * 360;
    const delay = Math.random() * 120;

    requestAnimationFrame(() => {
      setTimeout(() => {
        frag.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg)`;
        frag.style.opacity = '0';
      }, delay);
    });
  }

  setTimeout(() => {
    shatterFrags.forEach(f => f.remove());
    shatterFrags = [];
  }, 1300);
}

function restoreOctagon() {
  shatterFrags.forEach(f => f.remove());
  shatterFrags = [];
  octagon.style.opacity = '1';
  hub.style.opacity = '1';
  crankOrbit.style.opacity = '1';
}

function triggerDrop(forceColor) {
  // resolve the outcome and lock the game state synchronously, before any
  // animation delay, so the spinning drum can't sneak in a second drop
  // while this one is still being revealed
  decelTimer = 0;
  decelRollDone = false;
  chancesLeft -= 1;

  let color;
  if (forceColor) {
    color = forceColor;
    const i = pool.indexOf(color);
    if (i >= 0) pool.splice(i, 1);
  } else {
    color = drawBall();
  }
  const isWin = color !== 'white';
  resultColors.push(color);
  renderChances();

  if (isWin || chancesLeft <= 0) {
    gameEnded = true;
    velocity = 0; // stop the drum immediately so no further rolls can fire
  }
  updateCrankVisual();

  spawnPhysicsBall(color);

  ball.classList.remove('show');
  setTimeout(() => {
    ball.className = 'ball show ' + color;

    if (isWin) {
      msg.textContent = '당첨! 🎉';
      msg.className = 'msg win';
      spinHint.textContent = '축하합니다! 당첨으로 게임이 종료되었습니다.';
      playWinChime();
      ballCount += 1;
      updateEffortDisplay();
      winImage.src = WIN_IMAGES[Math.floor(Math.random() * WIN_IMAGES.length)];
      winBigSpender.classList.toggle('show', ballCount * EFFORT_PER_LOSE > BIG_SPENDER_THRESHOLD);
      setTimeout(() => {
        winOverlay.classList.add('show');
      }, 500);
    } else {
      msg.textContent = '꽝!';
      msg.className = 'msg lose';
      playLoseChime();
      ballCount += 1;
      updateEffortDisplay();
      if (gameEnded) {
        spinHint.textContent = '기회를 모두 사용했습니다. 새 게임을 시작해보세요.';
        playGameOverSound();
        shatterOctagon();
        gameOverOverlay.classList.add('show');
      } else {
        spinHint.textContent = `다시 손잡이를 돌려보세요! (남은 기회 ${chancesLeft}번)`;
      }
    }
  }, 300);
}

function tick(now) {
  const dt = Math.min((now - lastFrame) / 1000, 0.05);
  lastFrame = now;

  if (velocity > 0) {
    angle = (angle + velocity * dt) % 360;
    octagon.style.transform = `rotate(${angle}deg)`;
    storm.style.transform = `rotate(${angle}deg)`;
    crankOrbit.style.transform = `rotate(${angle}deg)`;
    crank.style.transform = `rotate(${-angle}deg)`;

    const stormShowing = velocity >= MAX_VELOCITY * STORM_RATIO;
    storm.classList.toggle('show', stormShowing);
    const shaking = velocity >= velocityCap - 0.01;
    if (shaking && !document.body.classList.contains('shake')) randomizeShake();
    document.body.classList.toggle('shake', shaking);

    if (stormShowing) {
      if (stormStartAt === null) {
        // storm sound just started (or restarted) this episode
        stormStartAt = now;
        surgeActive = false;
        stormFinishNaturally = false;
        velocityCap = MAX_VELOCITY;
      }
      const stormElapsed = (now - stormStartAt) / 1000;

      if (!surgeActive && stormElapsed >= STORM_SURGE_AT) {
        surgeActive = true;
        floodSpawned = 0;
        floodCarry = 0;
        velocityCap = MAX_VELOCITY * SURGE_SPEED_MULT;
      }

      if (surgeActive) {
        // flood: spread the balls evenly over the remaining time, no input needed
        const area = window.innerWidth * window.innerHeight * FLOOD_SCREEN_FRACTION;
        const target = Math.min(FLOOD_MAX_BALLS, Math.ceil(area * 1.5 / (Math.PI * (BALL_SIZE / 2) ** 2)));
        floodCarry += (target / (STORM_WIN_AT - STORM_SURGE_AT)) * dt;
        while (floodCarry >= 1 && floodSpawned < target) {
          floodCarry -= 1;
          floodSpawned += 1;
          spawnFloodBall();
        }

        if (stormElapsed >= STORM_WIN_AT && chancesLeft > 0 && !gameEnded) {
          surgeActive = false;
          stormFinishNaturally = true;
          releaseFloodBalls();
          triggerDrop(['red', 'blue', 'lime', 'purple'][Math.floor(Math.random() * 4)]);
        }
      }
    } else {
      stormStartAt = null;
      velocityCap = MAX_VELOCITY;
    }

    updateStormSound(dt, stormShowing || stormFinishNaturally);

    if (surgeActive) {
      velocity = velocityCap; // locked at surge speed, ignores friction
    } else {
      velocity *= Math.exp(-FRICTION * dt);
      if (velocity < 3) velocity = 0;
    }

    decelTimer += dt;

    // probability-based drops only apply before the drum reaches near-max
    // speed; once the storm kicks in, only the storm-timed forced drops fire
    if (!stormShowing) {
      const aboveMinSpeed = velocity >= MAX_VELOCITY * DROP_MIN_RATIO;
      if (chancesLeft > 0 && !gameEnded && aboveMinSpeed && !decelRollDone && decelTimer >= DECEL_DROP_AFTER) {
        decelRollDone = true;
        if (Math.random() < DECEL_DROP_CHANCE) {
          triggerDrop();
        }
      }
    }
  } else {
    stormStartAt = null;
    surgeActive = false;
    velocityCap = MAX_VELOCITY;
    storm.classList.remove('show');
    document.body.classList.remove('shake');
    updateStormSound(dt, stormFinishNaturally);
  }

  flame.classList.toggle('show', velocityCap > MAX_VELOCITY);

  updateSpinSound(dt, velocity > 0);
  updatePhysicsBalls(dt);
  updateBgDeco(dt, velocity);

  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function crankClick() {
  if (!canSpin()) {
    spinHint.textContent = gameEnded
      ? '게임이 종료되었습니다. 새 게임을 시작해보세요.'
      : '기회를 모두 사용했습니다. 새 게임을 시작해보세요.';
    return;
  }
  velocity = Math.min(velocity + CLICK_BOOST, velocityCap);
  decelTimer = 0;
  decelRollDone = false;
  spinHint.textContent = '계속 클릭해서 가속하고, 손을 떼면 감속하다 구슬이 떨어져요';

  // same rule as the decel roll: probability-based drops stop once the
  // drum reaches near-max (storm) speed
  const stormActive = velocity >= MAX_VELOCITY * STORM_RATIO;
  const aboveMinSpeed = velocity >= MAX_VELOCITY * DROP_MIN_RATIO;
  if (!stormActive && chancesLeft > 0 && !gameEnded && aboveMinSpeed && Math.random() < ACCEL_DROP_CHANCE) {
    triggerDrop();
  }
}

crank.addEventListener('click', crankClick);
octagon.addEventListener('click', crankClick);

function newGame() {
  physicsBalls.forEach(b => b.el.remove());
  physicsBalls = [];
  spinSound.pause();
  spinSound.currentTime = 0;
  spinVolume = 0;
  spinSoundPlaying = false;
  stormSound.pause();
  stormSound.currentTime = 0;
  stormVolume = 0;
  stormSoundPlaying = false;
  document.body.classList.remove('shake');
  restoreOctagon();
  refillPool();
  chancesLeft = MAX_CHANCES;
  gameEnded = false;
  velocity = 0;
  decelTimer = 0;
  decelRollDone = false;
  stormStartAt = null;
  surgeActive = false;
  floodSpawned = 0;
  floodCarry = 0;
  stormFinishNaturally = false;
  velocityCap = MAX_VELOCITY;
  resultColors = [];
  storm.classList.remove('show');
  flame.classList.remove('show');
  renderChances();
  updateCrankVisual();
  ball.classList.remove('show');
  msg.textContent = '기회 5번, 도전해보세요!';
  msg.className = 'msg';
  spinHint.textContent = '손잡이를 여러 번 클릭해서 돌려보세요 (계속 클릭하면 더 빨리 돌아가요)';
  winOverlay.classList.remove('show');
  winBigSpender.classList.remove('show');
  gameOverOverlay.classList.remove('show');
}

resetBtn.addEventListener('click', newGame);
winClose.addEventListener('click', () => {
  winOverlay.classList.remove('show');
  ballCount = 0;
  updateEffortDisplay();
});

updateEffortDisplay();
newGame();
</script>
